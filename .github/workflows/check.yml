name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/tirion-tui/go.mod
          cache-dependency-path: packages/tirion-tui/go.sum
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code
