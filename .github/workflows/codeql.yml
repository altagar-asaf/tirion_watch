name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/tirion-tui/go.mod
          cache-dependency-path: packages/tirion-tui/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,go
      - uses: github/codeql-action/analyze@v4
