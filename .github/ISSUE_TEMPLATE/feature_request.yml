name: Feature request
description: Suggest an improvement for the source-preview local agent.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Keep requests inside the preview product boundary: local agent, CLI, explicit repository watching, and local webhooks.
  - type: textarea
    id: job
    attributes:
      label: Job to be done
      description: What user job would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy considerations
      description: What sensitive data could this touch?
    validations:
      required: true
